name: Sync Google Sheet CSV

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download sheet CSV
        run: |
          curl -L -f -s "https://docs.google.com/spreadsheets/d/1Ui0ZVA-GQ8gOTDeJzsNjZmf_JTCh2XiIjxeE4DseGKg/export?format=csv" -o sheet.csv

      - name: Commit and push if changed
        run: |
          git config user.name "sheet-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sheet.csv
          git diff --staged --quiet || git commit -m "sync sheet $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
